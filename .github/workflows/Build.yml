name: Build AOD REAL tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build .deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl git perl dpkg-dev bzip2 zstd unzip xz-utils libxml2-dev clang

      - name: Setup Theos & Stable Linux Toolchain
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          
          # Tải toolchain build sẵn cho Linux (Server chính thức của Theos, không bị 504)
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -fsSL https://github.com/CRKCode/arm64-toolchain/releases/download/v1.0.0/arm64-toolchain-linux.tar.xz | tar -xJ -C "$THEOS/toolchain/linux/iphone"
          
          # Tải iOS SDK
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar -xz --strip-components=1 -C "$THEOS/sdks"

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export PATH="$THEOS/bin:$PATH"
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AODREAL-deb
          path: packages/*.deb
          if-no-files-found: error
