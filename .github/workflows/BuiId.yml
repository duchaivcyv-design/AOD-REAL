name: Build AOD REAL tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build .deb
    runs-on: ubuntu-22.04   # ← Ghim về 22.04 thay vì ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl git perl \
            dpkg-dev bzip2 zstd unzip xz-utils sudo libxml2-dev

      - name: Install Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS="$THEOS"
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos -o /tmp/install-theos.sh
          sed -i 's/ libxml2/ libxml2-dev/g' /tmp/install-theos.sh
          CI=1 bash /tmp/install-theos.sh

          echo "=== Toolchain check ==="
          ls "$THEOS/toolchain/linux/iphone/bin/clang"
          echo "=== SDKs check ==="
          ls "$THEOS/sdks/"

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AODREAL-deb
          path: packages/*.deb
          if-no-files-found: error
