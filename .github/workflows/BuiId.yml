name: Build AOD REAL tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build .deb and Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl git perl dpkg-dev bzip2 zstd unzip xz-utils sudo libxml2-dev

      - name: Install Theos via official script (patched)
        env:
          THEOS: ${{ github.workspace }}/theos
          CI: 1
        run: |
          export THEOS="$THEOS"
          # CI=1 tránh nhắc nhập mật khẩu; sed thay thế libxml2 bằng libxml2-dev để tương thích Ubuntu 26.04
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos | sed 's/ libxml2/ libxml2-dev/g')"
          # Xác minh toolchain và SDK
          echo "=== Toolchain check ==="
          ls "$THEOS/toolchain/linux/iphone/bin/clang"
          echo "=== SDKs check ==="
          ls "$THEOS/sdks/"

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Make Repository Files for Sileo & Find Deb
        run: |
          mkdir -p public/debs
          
          find . -name "*.deb" ! -path "./public/*" -exec cp -v {} public/debs/ \;
          
          if [ -z "$(ls -A public/debs)" ]; then
             echo "Error: Không tìm thấy file .deb nào sau khi build!"
             exit 1
          fi
          
          cd public
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -9 -c Packages > Packages.bz2
          zstd -c Packages > Packages.zst
          
          cat << 'EOF' > Release
          Origin: AOD REAL Repo
          Label: AOD REAL Repo
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64
          Components: main
          Description: Repository for AOD REAL Tweak
          EOF
          cd ..

      - name: Upload Repository Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository
          path: public/
